name: Build Yuzu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Yuzu Android source
        uses: actions/checkout@v4
        with:
          repository: yuzu-revived/yuzu
          ref: bebf5ba9415cefdb9ca2c6ca7cafd5aa483a542a
          path: yuzu-src
          submodules: recursive
          fetch-depth: 0

      - name: Apply Yuzu Android compatibility patch
        working-directory: yuzu-src
        run: git apply ../patches/yuzu-android-boost-process.patch

      - name: Disable Yuzu tests for Android
        working-directory: yuzu-src
        run: git apply ../patches/yuzu-android-tests-off.patch
      - name: Apply experimental 0.25x resolution
        working-directory: yuzu-src
        run: git apply ../patches/yuzu-android-resolution-025.patch

      - name: Apply ASTC decoding mode
        working-directory: yuzu-src
        run: git apply ../patches/yuzu-android-astc.patch

      - name: Apply mbedTLS Android warning fix
        working-directory: yuzu-src/externals/mbedtls
        run: git apply ../../../patches/yuzu-android-mbedtls-doc.patch

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache glslang-dev glslang-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Yuzu Android
        working-directory: yuzu-src/src/android
        env:
          CFLAGS: "-Wno-documentation"
          CXXFLAGS: "-Wno-documentation"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assemblemainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yuzu-Android-APK
          path: yuzu-src/src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk
          if-no-files-found: error
          retention-days: 14
